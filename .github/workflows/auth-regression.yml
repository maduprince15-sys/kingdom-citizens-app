name: Authentication regression
on:
  push:
    branches: [feature/kingdom-citizens-glass-audit-20261106]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint:auth
      - name: Record existing repository lint debt
        continue-on-error: true
        run: npm run lint
      - run: npm run build
