name: Kingdom Citizens Android Beta APK

on:
  push:
    branches:
      - test/kingdom-citizens-android-beta-20261106
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-beta:
    name: Build isolated Kingdom Citizens Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Android beta
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configure Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Configure Android Java
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install repository dependencies
        run: npm ci

      - name: Verify Kingdom Citizens redesign safety contracts
        run: npm test

      - name: Generate independent Android beta project
        run: |
          cp capacitor.android-beta.config.ts capacitor.config.ts
          test -s mobile-beta/index.html
          grep -q 'com.kingdomcitizens.app.beta' capacitor.config.ts
          # Repo preserves the production AndroidManifest source but not the
          # complete Android Gradle project. Remove only the ephemeral CI copy.
          rm -rf android
          npx cap add android
          npx cap sync android
          # Install the approved original logo without changing source assets.
          cp public/kingdom-citizens-logo.png resources/icon.png
          npx capacitor-assets generate --android --iconBackgroundColor '#090405' --iconBackgroundColorDark '#090405'
          python3 - <<'PYCODE'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          source = manifest.read_text()
          source = source.replace('android:allowBackup="true"', 'android:allowBackup="false"')
          intent = '''
              <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="kingdomcitizensbeta" android:host="auth" android:path="/callback" />
              </intent-filter>
          '''
          source = source.replace('</activity>', intent + '</activity>')
          manifest.write_text(source)
          PYCODE

      - name: Confirm Android beta identity
        run: |
          grep -R 'com.kingdomcitizens.app.beta' android/app/build.gradle
          grep -R 'Kingdom Citizens Beta' android/app/src/main/res/values/strings.xml
          grep -F 'android:scheme="kingdomcitizensbeta"' android/app/src/main/AndroidManifest.xml
          grep -F 'android:allowBackup="false"' android/app/src/main/AndroidManifest.xml

      - name: Install Android SDK 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build Android beta APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon :app:assembleDebug

      - name: Confirm APK package is isolated from production
        run: |
          apk='android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -F "package: name='com.kingdomcitizens.app.beta'"
          cp "$apk" Kingdom-Citizens-Beta-debug.apk
          sha256sum Kingdom-Citizens-Beta-debug.apk > android-beta-sha256.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > android-beta-signature.txt
          sha256sum --check android-beta-sha256.txt
          git rev-parse HEAD > android-beta-source.txt
          printf '%s\n' 'Web source: 3e04ba6520825439e21b8567070e5dd04a787d32' >> android-beta-source.txt
          cp docs/ANDROID_BETA_TEST_README.md Android-Beta-Acceptance.md

      - name: Upload APK for later owner-led Android testing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Kingdom-Citizens-Android-Beta
          path: |
            Kingdom-Citizens-Beta-debug.apk
            android-beta-sha256.txt
            android-beta-signature.txt
            android-beta-source.txt
            Android-Beta-Acceptance.md
          if-no-files-found: error
          retention-days: 14

  verify-beta:
    name: Retrieve and verify the uploaded beta APK
    needs: android-beta
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download this run's APK through GitHub Actions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Kingdom-Citizens-Android-Beta
          path: verified-beta
      - name: Verify downloaded bytes and archive integrity
        working-directory: verified-beta
        run: |
          test -s Kingdom-Citizens-Beta-debug.apk
          sha256sum --check android-beta-sha256.txt
          unzip -tq Kingdom-Citizens-Beta-debug.apk
          test -s android-beta-signature.txt
          test -s android-beta-source.txt
          printf '### Android beta artifact verified\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'A separate Actions job retrieved the APK and verified its checksum and ZIP integrity. This is a debug beta; device behavior is not verified.\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat android-beta-sha256.txt >> "$GITHUB_STEP_SUMMARY"
          cat android-beta-source.txt >> "$GITHUB_STEP_SUMMARY"
